[package]
name = "darling"
version = "0.1.0"
edition = "2021"
description = "Darling — global macOS AI assistant"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = ["macos-private-api"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
arboard     = "3"
objc2-app-kit   = "0.3"
objc2-foundation = "0.3"

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

# Fix: objc2 debug assertion causes panic in extern "C" callback
# See https://github.com/tauri-apps/tauri/issues/11496
[profile.dev.package.objc2]
debug-assertions = false
[profile.dev.package.objc2-foundation]
debug-assertions = false
[profile.dev.package.objc2-app-kit]
debug-assertions = false
[profile.dev.package.objc2-web-kit]
debug-assertions = false
